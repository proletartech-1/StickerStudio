<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proletar Tech · Invoice</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCF0DA;--panel:#fff9ec;--ink:#4C4541;--mute:#7b716a;--line:#e8d9b8;--gold:#F2C46A;--olive:#AEAC78;--field:#fff;--btn:#4C4541;--btn-ink:#FCF0DA;--lf:none;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#27221f;--panel:#332d29;--ink:#FCF0DA;--mute:#b9ad9c;--line:#4b433d;--field:#27221f;--btn:#F2C46A;--btn-ink:#3a312a;--lf:brightness(0) invert(.94)}}
:root[data-theme="dark"]{--bg:#27221f;--panel:#332d29;--ink:#FCF0DA;--mute:#b9ad9c;--line:#4b433d;--field:#27221f;--btn:#F2C46A;--btn-ink:#3a312a;--lf:brightness(0) invert(.94)}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Figtree,sans-serif;margin:0}
.bar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:3px solid var(--gold);background:var(--panel);flex-wrap:wrap}
.bar img{height:44px;filter:var(--lf)}.bar b{font:700 26px "Barlow Condensed",sans-serif;letter-spacing:1px}
.bar nav{margin-left:auto;display:flex;gap:6px}
.bar nav button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.app{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:20px;max-width:1200px;margin:0 auto;padding:20px}
.form,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.form{align-self:start}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:12px 0 4px}fieldset:first-of-type{border:0;padding-top:0}
legend{font:700 19px "Barlow Condensed",sans-serif;letter-spacing:.5px;padding:0 8px 0 0}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
input,textarea,select{width:100%;margin-top:3px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit}
:is(input,textarea,select,button):focus-visible{outline:2px solid var(--gold);outline-offset:1px}
textarea{resize:vertical;min-height:58px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.r3{display:grid;grid-template-columns:62px 74px 1fr auto;gap:8px;align-items:end}.r3 label{margin:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 13px}
button.p{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:600}
button.g{background:var(--gold);border-color:var(--gold);color:#3a312a;font-weight:600}
button.armed{background:#b3412f;color:#fff;border-color:#b3412f}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pv{min-width:0;overflow-x:auto}
.paper{position:relative;background:#fff;color:#3b3430;max-width:794px;min-height:900px;margin:0 auto;padding:44px 46px;border-radius:6px;box-shadow:0 2px 18px rgba(40,30,20,.2);font-size:13.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:4px solid #F2C46A;padding-bottom:18px}
.top img{height:78px;display:block;margin-bottom:8px}
.paper h2{font-size:42px;color:#4C4541;letter-spacing:2px;text-align:right;line-height:1}
.meta{text-align:right;color:#6b625b;margin-top:6px}
.pre{white-space:pre-line}
.parties{margin:22px 0}.parties small,.foot small{display:block;color:#7b716a;margin-bottom:2px}
.paper table{width:100%;border-collapse:collapse}
.paper th{text-align:left;background:#FCF0DA;color:#4C4541;padding:9px 10px;border-bottom:2px solid #AEAC78}
.paper td{padding:9px 10px;border-bottom:1px solid #eee5d0;vertical-align:top}
.n{text-align:right;white-space:nowrap}
.tot{margin:16px 0 0 auto;width:min(320px,100%)}.tot div{display:flex;justify-content:space-between;padding:4px 10px;gap:10px}
.tot .grand{background:#4C4541;color:#FCF0DA;font-weight:700;font-size:16px;border-radius:6px;margin-top:6px;padding:10px;border-left:6px solid #F2C46A}
.tot .left{font-weight:700;background:#FCF0DA;border-radius:6px;margin-top:4px}
.words{margin-top:14px;color:#6b625b;font-style:italic}
.foot{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.sign{margin-top:46px;text-align:right}.sign span{display:inline-block;min-width:170px;border-top:1px solid #4C4541;padding-top:4px;text-align:center}
.stamp{position:absolute;right:46px;top:160px;transform:rotate(-12deg);border:4px solid #AEAC78;color:#7d7b4a;padding:2px 18px;font:700 36px "Barlow Condensed",sans-serif;letter-spacing:4px;border-radius:6px;opacity:.85}
.hint{max-width:794px;margin:10px auto 0;color:var(--mute);font-size:13px}
.hv{max-width:1000px;margin:0 auto;padding:20px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.sum .card b{display:block;font:700 24px "Barlow Condensed",sans-serif}.sum .card span{color:var(--mute);font-size:13px}
.tools{display:grid;grid-template-columns:1fr 200px;gap:10px;margin-bottom:12px}.tools label{margin:0}
.li{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}.li small{color:var(--mute)}
.bd{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);margin-left:6px}
.bd.lunas{background:var(--olive);color:#2f2d18}.bd.telat{background:#e9b8a9;color:#5b1f12}.bd.terkirim{background:var(--gold);color:#3a312a}
.li .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.li .a button{padding:5px 10px;font-size:13px}
#bk{min-height:90px;font:12px monospace}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:9px 16px;border-radius:99px;z-index:9}
@media (max-width:860px){.app{grid-template-columns:1fr;padding:12px}.paper{padding:26px 18px}.paper h2{font-size:30px}.li{grid-template-columns:1fr}.li .a{justify-content:flex-start}.tools{grid-template-columns:1fr}}
@media print{:root{padding:0}body{background:#fff}.bar,.form,.hint,#vh,.toast{display:none!important}.app{display:block;padding:0;max-width:none}.pv{overflow:visible}.paper{box-shadow:none;border-radius:0;max-width:none;padding:0;min-height:0}@page{margin:14mm}}
</style>
</head>
<body>
<header class="bar"><img id="bl" alt="Logo Proletar Tech"><b>Proletar Tech</b>
<nav><button type="button" data-tab="e" aria-pressed="true">Editor</button><button type="button" data-tab="h" aria-pressed="false">Riwayat <span id="cnt"></span></button></nav></header>

<main class="app" id="ve">
<section class="form" aria-label="Formulir invoice">
<fieldset><legend>Invoice</legend>
<div class="row"><label>Nomor<input id="no"></label><label>Status<select id="status"><option value="draft">Draft</option><option value="terkirim">Terkirim</option><option value="lunas">Lunas</option></select></label></div>
<div class="row"><label>Tanggal<input type="date" id="date"></label><label>Jatuh tempo<input type="date" id="due"></label></div><label>Termin cepat<select id="term"><option value="">Pilih termin</option><option value="0">Bayar langsung</option><option value="7">7 hari</option><option value="14">14 hari</option><option value="30">30 hari</option></select></label>
<label>Mata uang<select id="cur"><option value="IDR">Rupiah (Rp)</option><option value="USD">US Dollar ($)</option></select></label></fieldset>
<fieldset><legend>Pengirim</legend>
<label>Logo (bawaan: Proletar Tech)<input type="file" id="logo" accept="image/*"></label>
<button type="button" id="logo0" style="margin:-4px 0 10px">Pakai logo bawaan</button>
<label>Nama usaha<input id="from"></label><label>Alamat, telepon, email<textarea id="fromInfo"></textarea></label></fieldset>
<fieldset><legend>Klien</legend><label>Nama klien<input id="to" list="clients" autocomplete="off"></label><datalist id="clients"></datalist><label>Alamat, telepon, email<textarea id="toInfo"></textarea></label><label>WhatsApp klien<input id="toWa" inputmode="tel" placeholder="08xxxxxxxxxx"></label></fieldset>
<datalist id="units"><option value="pcs"><option value="unit"><option value="jam"><option value="hari"><option value="bulan"><option value="paket"></datalist><fieldset><legend>Item</legend><div id="items"></div><button type="button" id="add">Tambah item</button></fieldset>
<fieldset><legend>Biaya</legend>
<div class="row"><label>Diskon<input type="number" id="disc" min="0" step="any"></label><label>Jenis diskon<select id="dt"><option value="%">Persen (%)</option><option value="n">Nominal</option></select></label></div>
<div class="row"><label>PPN (%)<input type="number" id="tax" min="0" step="any"></label><label>Biaya lain / ongkir<input type="number" id="fee" min="0" step="any"></label></div>
<label>Sudah dibayar (DP)<input type="number" id="paid" min="0" step="any"></label></fieldset>
<fieldset><legend>Penutup</legend><label>Info rekening<textarea id="pay"></textarea></label><label>Catatan<textarea id="note"></textarea></label><label>Nama penandatangan<input id="signer"></label></fieldset>
<div class="acts"><button type="button" class="p" id="save">Simpan ke riwayat</button><button type="button" class="g" id="print">Cetak / PDF</button><button type="button" id="wal">Kirim via WhatsApp</button><button type="button" id="wa">Salin teks WhatsApp</button><button type="button" id="new">Invoice baru</button></div>
</section>
<section class="pv"><article class="paper" id="paper"></article><p class="hint">Di dialog cetak, pilih “Simpan sebagai PDF”. Perubahan tersimpan otomatis di browser ini.</p></section>
</main>

<main class="hv" id="vh" hidden>
<div class="sum" id="sum"></div>
<div class="card"><div class="tools"><label>Cari nomor atau klien<input id="q"></label><label>Status<select id="fs"><option value="">Semua</option><option value="draft">Draft</option><option value="terkirim">Terkirim</option><option value="telat">Lewat jatuh tempo</option><option value="lunas">Lunas</option></select></label></div><div id="list"></div></div>
<div class="card" style="margin-top:16px"><h3>Cadangan data</h3><p style="color:var(--mute);margin:4px 0 10px">Buat cadangan lalu simpan teksnya, atau tempel cadangan lama untuk memulihkan.</p>
<textarea id="bk" aria-label="Teks cadangan"></textarea><div class="acts"><button type="button" id="bkmk">Buat cadangan</button><button type="button" id="bkrs">Pulihkan dari teks</button><button type="button" id="csv">Salin rekap CSV</button></div></div>
</main>
<div class="toast" id="toast" hidden></div>

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var U=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
function f(n){if(n<12)return U[n];if(n<20)return f(n-10)+" belas";if(n<100)return f(Math.floor(n/10))+" puluh "+f(n%10);if(n<200)return"seratus "+f(n-100);if(n<1e3)return f(Math.floor(n/100))+" ratus "+f(n%100);if(n<2e3)return"seribu "+f(n-1e3);if(n<1e6)return f(Math.floor(n/1e3))+" ribu "+f(n%1e3);if(n<1e9)return f(Math.floor(n/1e6))+" juta "+f(n%1e6);if(n<1e12)return f(Math.floor(n/1e9))+" miliar "+f(n%1e9);return f(Math.floor(n/1e12))+" triliun "+f(n%1e12)}
function words(n){n=Math.round(n);return n===0?"nol":f(n).replace(/\s+/g," ").trim()}
function st(v){return v.status==="lunas"?"lunas":(v.due&&v.due<iso(T)?"telat":v.status)}
var SL={draft:"Draft",terkirim:"Terkirim",lunas:"Lunas",telat:"Lewat jatuh tempo"};
var logo=function(){return DB.logo||LOGO};

function paper(){var c=calc(S),m=function(n){return money(n,S.cur)};
$("bl").src=logo();
var rows=S.items.map(function(i){return"<tr><td>"+esc(i.d||"-")+'</td><td class="n">'+esc(i.q)+(i.u?' '+esc(i.u):'')+'</td><td class="n">'+m(+i.p||0)+'</td><td class="n">'+m((+i.q||0)*(+i.p||0))+"</td></tr>"}).join("");
$("paper").innerHTML=(S.status==="lunas"?'<div class="stamp">LUNAS</div>':"")+
'<div class="top"><div><img alt="Logo" src="'+logo()+'"><b style="font-size:17px">'+esc(S.from||"Nama usaha")+'</b><div class="pre">'+esc(S.fromInfo)+'</div></div><div><h2>INVOICE</h2><div class="meta"><b>'+esc(S.no)+"</b><br>Tanggal: "+dt(S.date)+"<br>Jatuh tempo: "+dt(S.due)+"</div></div></div>"+
'<div class="parties"><small>Ditagihkan kepada</small><b>'+esc(S.to||"Nama klien")+'</b><div class="pre">'+esc(S.toInfo)+"</div></div>"+
'<table><thead><tr><th>Deskripsi</th><th class="n">Jumlah</th><th class="n">Harga</th><th class="n">Total</th></tr></thead><tbody>'+rows+"</tbody></table>"+
'<div class="tot"><div><span>Subtotal</span><span>'+m(c.sub)+"</span></div>"+
(c.dv?"<div><span>Diskon"+(S.dt==="%"?" ("+esc(S.disc)+"%)":"")+"</span><span>-"+m(c.dv)+"</span></div>":"")+
(+S.tax?"<div><span>PPN ("+esc(S.tax)+"%)</span><span>"+m(c.tx)+"</span></div>":"")+
(+S.fee?"<div><span>Biaya lain</span><span>"+m(+S.fee)+"</span></div>":"")+
'<div class="grand"><span>Total</span><span>'+m(c.tot)+"</span></div>"+
(+S.paid?"<div><span>Sudah dibayar</span><span>-"+m(+S.paid)+'</span></div><div class="left"><span>Sisa tagihan</span><span>'+m(c.left)+"</span></div>":"")+"</div>"+
(S.cur==="IDR"&&c.tot>0?'<div class="words">Terbilang: '+esc(words(c.tot))+" rupiah</div>":"")+
'<div class="foot"><div>'+(S.pay?"<small>Pembayaran</small><div class=\"pre\">"+esc(S.pay)+"</div>":"")+"</div><div>"+(S.note?"<small>Catatan</small><div class=\"pre\">"+esc(S.note)+"</div>":"")+"</div></div>"+
(S.signer?'<div class="sign"><span>'+esc(S.signer)+"</span></div>":"");
document.title=(S.no||"Invoice")+" · Proletar Tech"}

function items(){$("items").innerHTML=S.items.map(function(it,i){return'<div class="item"><label>Deskripsi<input data-i="'+i+'" data-k="d" value="'+esc(it.d)+'"></label><div class="r3"><label>Jumlah<input type="number" min="0" step="any" data-i="'+i+'" data-k="q" value="'+esc(it.q)+'"></label><label>Satuan<input data-i="'+i+'" data-k="u" list="units" placeholder="pcs" value="'+esc(it.u)+'"></label><label>Harga satuan<input type="number" min="0" step="any" data-i="'+i+'" data-k="p" value="'+esc(it.p)+'"></label><button type="button" data-del="'+i+'" aria-label="Hapus item '+(i+1)+'">Hapus</button></div></div>'}).join("")}
var F=["no","status","cur","date","due","from","fromInfo","to","toInfo","toWa","dt","disc","tax","fee","paid","pay","note","signer"];
function fill(){F.forEach(function(k){$(k).value=S[k]==null?"":S[k]})}
function sync(){DB.cur=S;var i=DB.hist.findIndex(function(h){return h.id===S.id});if(i>-1)DB.hist[i]=clone(S);persist();paper();clients();$("cnt").textContent=DB.hist.length?"("+DB.hist.length+")":""}
F.forEach(function(k){$(k).addEventListener("input",function(){S[k]=this.value;if(k==="to"&&S.to){var c=DB.hist.find(function(h){return h.to===S.to});if(c&&!S.toInfo&&!S.toWa){S.toInfo=c.toInfo;S.toWa=c.toWa||"";$("toInfo").value=S.toInfo;$("toWa").value=S.toWa}}sync()})});
$("term").onchange=function(){if(this.value==="")return;var d=new Date(S.date+"T00:00:00");d.setDate(d.getDate()+ +this.value);S.due=iso(d);$("due").value=S.due;this.value="";sync()};
$("items").addEventListener("input",function(e){var i=e.target.getAttribute("data-i");if(i===null)return;S.items[i][e.target.getAttribute("data-k")]=e.target.value;sync()});
$("items").addEventListener("click",function(e){var d=e.target.getAttribute("data-del");if(d===null)return;S.items.splice(+d,1);if(!S.items.length)S.items.push({q:1,d:"",p:0});items();sync()});
$("add").onclick=function(){S.items.push({q:1,d:"",p:0});items();sync()};
$("logo").onchange=function(){var f=this.files&&this.files[0];if(!f)return;if(f.size>400*1024){toast("Logo maksimal 400 KB");this.value="";return}var r=new FileReader();r.onload=function(){DB.logo=r.result;sync()};r.readAsDataURL(f)};
$("logo0").onclick=function(){DB.logo="";$("logo").value="";sync()};
function has(v){return v.to||v.items.some(function(i){return i.d||+i.p})}
$("save").onclick=function(){var i=DB.hist.findIndex(function(h){return h.id===S.id});if(i>-1)DB.hist[i]=clone(S);else DB.hist.unshift(clone(S));persist();sync();toast("Tersimpan di riwayat")};
function open(v){S=clone(v);fill();items();sync();tab("e")}
function fresh(){if(has(S)&&!DB.hist.some(function(h){return h.id===S.id}))DB.hist.unshift(clone(S));S=mk(S);fill();items();sync();toast("Invoice baru dibuat")}
$("new").onclick=fresh;
$("print").onclick=function(){try{window.print()}catch(e){toast("Cetak diblokir. Buka halaman ini di tab baru.")}};
function copy(t){function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Tersalin")}catch(e){toast("Gagal menyalin")}a.remove()}
try{navigator.clipboard.writeText(t).then(function(){toast("Tersalin")},fb)}catch(e){fb()}}
function waText(){var c=calc(S);return("*Invoice "+S.no+"*\nKepada: "+(S.to||"-")+"\nTotal: "+money(c.tot,S.cur)+(+S.paid?"\nSisa: "+money(c.left,S.cur):"")+"\nJatuh tempo: "+dt(S.due)+(S.pay?"\n\nPembayaran:\n"+S.pay:"")+"\n\nTerima kasih,\n"+S.from)}
$("wa").onclick=function(){copy(waText())};
$("wal").onclick=function(){var n=(S.toWa||"").replace(/\D/g,"");if(n[0]==="0")n="62"+n.slice(1);var w=null;try{w=window.open("https://wa.me/"+n+"?text="+encodeURIComponent(waText()),"_blank")}catch(e){}if(w){if(S.status==="draft"){S.status="terkirim";$("status").value="terkirim";sync()}}else{copy(waText());toast("Teks disalin. Tempel di WhatsApp.")}};

function tab(t){$("ve").hidden=t!=="e";$("vh").hidden=t!=="h";document.querySelectorAll("[data-tab]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.tab===t)});if(t==="h")hist();window.scrollTo(0,0)}
document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab(b.dataset.tab)}});
function hist(){
var q=$("q").value.toLowerCase(),fs=$("fs").value,G={};
DB.hist.forEach(function(h){var c=calc(h),g=G[h.cur]=G[h.cur]||{t:0,p:0,l:0};g.t+=c.tot;g.p+=Math.min(c.tot,h.status==="lunas"?c.tot:(+h.paid||0));g.l+=h.status==="lunas"?0:c.left});
var j=function(k){var a=Object.keys(G).map(function(c){return money(G[c][k],c)});return a.length?a.join(" + "):money(0,"IDR")};
$("sum").innerHTML='<div class="card"><span>Jumlah invoice</span><b>'+DB.hist.length+'</b></div><div class="card"><span>Total tagihan</span><b>'+j("t")+'</b></div><div class="card"><span>Sudah masuk</span><b>'+j("p")+'</b></div><div class="card"><span>Belum dibayar</span><b>'+j("l")+"</b></div>"+'<div class="card"><span>Lewat jatuh tempo</span><b>'+DB.hist.filter(function(h){return st(h)==="telat"}).length+"</b></div>";
var L=DB.hist.filter(function(h){return(!q||(h.no+" "+h.to).toLowerCase().indexOf(q)>-1)&&(!fs||st(h)===fs)});
$("list").innerHTML=L.length?L.map(function(h){var s=st(h);return'<div class="li"><div><b>'+esc(h.no)+'</b><span class="bd '+s+'">'+SL[s]+"</span><br>"+esc(h.to||"Tanpa nama klien")+" · "+money(calc(h).tot,h.cur)+"<br><small>Tanggal "+dt(h.date)+" · jatuh tempo "+dt(h.due)+'</small></div><div class="a"><button type="button" data-a="open" data-id="'+h.id+'">Buka</button><button type="button" data-a="dup" data-id="'+h.id+'">Duplikat</button><button type="button" data-a="paid" data-id="'+h.id+'">'+(h.status==="lunas"?"Batal lunas":"Tandai lunas")+'</button><button type="button" data-a="del" data-id="'+h.id+'">Hapus</button></div></div>'}).join(""):'<p style="color:var(--mute)">'+(DB.hist.length?"Tidak ada invoice yang cocok.":"Belum ada invoice. Isi di Editor lalu pilih Simpan ke riwayat.")+"</p>";
$("cnt").textContent=DB.hist.length?"("+DB.hist.length+")":""}
$("q").oninput=hist;$("fs").onchange=hist;
$("list").onclick=function(e){var a=e.target.dataset.a,id=e.target.dataset.id;if(!a)return;var i=DB.hist.findIndex(function(h){return h.id===id}),h=DB.hist[i];if(!h)return;
if(a==="open")return open(h);
if(a==="dup"){var n=mk(h);n.to=h.to;n.toInfo=h.toInfo;n.toWa=h.toWa;n.items=clone(h.items);n.dt=h.dt;n.disc=h.disc;n.tax=h.tax;n.fee=h.fee;DB.hist.unshift(n);persist();hist();return toast("Diduplikat sebagai "+n.no)}
if(a==="paid"){h.status=h.status==="lunas"?"terkirim":"lunas";if(S.id===h.id){S.status=h.status;fill();paper()}persist();return hist()}
if(a==="del"){if(!e.target.classList.contains("armed")){e.target.classList.add("armed");e.target.textContent="Yakin hapus?";return}DB.hist.splice(i,1);persist();hist();toast("Invoice dihapus")}};
$("bkmk").onclick=function(){$("bk").value=JSON.stringify({hist:DB.hist,logo:DB.logo});$("bk").select();copy($("bk").value)};
$("bkrs").onclick=function(){try{var d=JSON.parse($("bk").value);if(!Array.isArray(d.hist))throw 0;var ids={};DB.hist.forEach(function(h){ids[h.id]=1});d.hist.forEach(function(h){if(h&&h.id&&Array.isArray(h.items)&&!ids[h.id])DB.hist.push(h)});if(d.logo&&!DB.logo)DB.logo=d.logo;persist();hist();toast("Cadangan dipulihkan")}catch(e){toast("Teks cadangan tidak valid")}};

function clients(){var s={};DB.hist.forEach(function(h){if(h.to)s[h.to]=1});$("clients").innerHTML=Object.keys(s).map(function(n){return'<option value="'+esc(n)+'">'}).join("")}
$("csv").onclick=function(){var r=[["No","Tanggal","Jatuh tempo","Klien","Mata uang","Total","Dibayar","Sisa","Status"]];DB.hist.forEach(function(h){var c=calc(h),l=h.status==="lunas";r.push([h.no,h.date,h.due,h.to,h.cur,Math.round(c.tot*100)/100,l?c.tot:(+h.paid||0),l?0:c.left,SL[st(h)]])});copy(r.map(function(x){return x.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\n"))};
fill();items();paper();clients();hist();
})();
</script>
</body>
</html>
